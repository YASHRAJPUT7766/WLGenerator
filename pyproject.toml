[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "wlgen"
version = "3.2.1"
description = "WL Gen - a rule-based wordlist generator for authorized security research and password auditing"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "WL Gen contributors" }]
keywords = ["security", "wordlist", "password-audit", "ctf", "cli"]
classifiers = [
    "Environment :: Console",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Security",
    "Topic :: Utilities",
]
dependencies = [
    "colorama>=0.4.6",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
wlgen = "cli.main:main"

[tool.setuptools.packages.find]
include = ["cli*", "rules*", "generator*", "input*", "output*", "config*", "checker*", "ui*", "utils*", "tests*", "_meta*"]

[tool.setuptools.package-data]
config = ["example_config.toml"]
