name: Build and Attach Release Asset

# Runs automatically whenever a tag like "v3.2.1" is pushed.
# Packages the repo into a .tar.gz (excluding .git, caches, etc.) and
# attaches it to the matching GitHub Release.
on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Read version from tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Build tar.gz archive
        run: |
          mkdir -p /tmp/build/wlgen
          rsync -a --exclude='.git' --exclude='.github' \
                    --exclude='__pycache__' --exclude='*.pyc' \
                    --exclude='*.egg-info' \
                    ./ /tmp/build/wlgen/
          cd /tmp/build
          tar -czvf wlgen-${{ steps.version.outputs.version }}.tar.gz wlgen
          mv wlgen-${{ steps.version.outputs.version }}.tar.gz "$GITHUB_WORKSPACE/"

      - name: Build zip archive
        run: |
          cd /tmp/build
          zip -r wlgen-${{ steps.version.outputs.version }}.zip wlgen
          mv wlgen-${{ steps.version.outputs.version }}.zip "$GITHUB_WORKSPACE/"

      - name: Create GitHub Release with assets
        uses: softprops/action-gh-release@v2
        with:
          name: "WL Gen v${{ steps.version.outputs.version }}"
          files: |
            wlgen-${{ steps.version.outputs.version }}.tar.gz
            wlgen-${{ steps.version.outputs.version }}.zip
